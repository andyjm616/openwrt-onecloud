name: openwrt

on:
  repository_dispatch:
  workflow_dispatch:

    inputs:
      ENABLE_DHCP:
        description: '是否开启DHCP'
        required: false
        default: 'false'
        type: boolean

      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.5.6'
        type: string

      OP_rootfs:
        description: '预设镜像大小'
        required: false
        default: '800'
        type: string

      OP_author:
        description: '定制作者'
        required: false
        default: 'shiyu1314'
        type: string

      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-theme-m3e luci-app-ttyd luci-app-diskman luci-app-hd-idle luci-app-samba4'
        type: string

env:
  DIY_P1_SH: sh/op.sh

jobs:
  build_firmware:
    name: 编译固件 - ${{ matrix.device }} - ${{ matrix.source }}
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        device: ["玩客云-ws1608"]
        source: ["openwrt"]
        include:
          - device: "玩客云-ws1608"
            config: "CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y"

    steps:

    - name: 检查分支
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo snap set system refresh.retain=2
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/local /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th

    - name: 编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar img2simg build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
        sudo apt-get clean
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: 设置环境变量
      run: |
        TAG="$(date +'%Y%m%d')-$(openssl rand -hex 3)"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
        echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
        echo "OP_IP=${{ github.event.inputs.OP_IP }}" >> $GITHUB_ENV
        echo "OP_author=${{ github.event.inputs.OP_author }}" >> $GITHUB_ENV
        echo "OP_rootfs=${{ github.event.inputs.OP_rootfs }}" >> $GITHUB_ENV
        echo "CUSTOM_PLUGINS=${{ github.event.inputs.CUSTOM_PLUGINS }}" >> $GITHUB_ENV
        echo "ENABLE_DHCP=${{ github.event.inputs.ENABLE_DHCP }}" >> $GITHUB_ENV

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 切换分支
      working-directory: ./openwrt
      id: var
      run: |
        case $REPO_BRANCH in
          openwrt-25.12)
            _release_tag=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
            git checkout $_release_tag
            _prerelease=false
            ;;
          openwrt-24.10)
            _release_tag=$(git tag --sort=taggerdate --list 'v24.*' | tail -1)
            git checkout $_release_tag
            _prerelease=false
            ;;
          *)
            echo "Can't get local/upstream's branch/tags"
            ;;
        esac
        echo "release_tag=$_release_tag" >> $GITHUB_ENV

    - name: 取回缓存 staging_dir
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir
        key: ${{ env.REPO_BRANCH }}-toolchain-cache
        restore-keys: |
          ${{ env.REPO_BRANCH }}-toolchain-cache

    - name: patch修补
      run: |
        set -x

        echo "===== 1. 检查 APK patch ====="
        if [ -d patch/apk-tools ] && compgen -G "patch/apk-tools/*.patch" > /dev/null; then
          echo "发现 APK patch:"
          ls -la patch/apk-tools/
          mkdir -p openwrt/package/system/apk/patches
          cp -vf patch/apk-tools/*.patch openwrt/package/system/apk/patches/
        else
          echo "没有 APK patch，跳过"
        fi

        echo "===== 2. 下载 Config-kernel.in ====="
        curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
          https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/config/Config-kernel.in \
          -o openwrt/config/Config-kernel.in
        echo "Config-kernel.in 下载成功"

        echo "===== 3. 修改 feeds ====="
        sed -i 's#https://git\.openwrt\.org/feed#https://github.com/openwrt#g; s#https://git\.openwrt\.org/project#https://github.com/openwrt#g' \
          openwrt/feeds.conf.default

        echo "===== 4. 更新 feeds ====="
        cd openwrt

        find ./staging_dir/ -exec touch {} + >/dev/null 2>&1 || true

        ./scripts/feeds update -a

        cd ..

        echo "===== 5. target 补丁 ====="
        if [ -d patch/target ]; then
          cp -rf patch/target openwrt/
        fi

        echo "===== 6. LuCI 补丁 ====="
        if [ -d patch/luci ] && compgen -G "patch/luci/*.patch" > /dev/null; then
          cp -vf patch/luci/*.patch openwrt/feeds/luci/
        fi

        echo "===== 7. DIY 补丁 ====="
        if [ -d patch/diy ]; then
          cp -rf patch/diy openwrt/
        fi

        echo "===== patch修补完成 ====="
    - name: 添加玩客云
      run: |
        set -eux
        cd openwrt

        # OneCloud 在官方 OpenWrt 25.12 源码中没有可直接使用的 meson8b 设备定义。
        # 按公开的 25.12 OneCloud 构建方案，只替换 Amlogic target，并保留官方 25.12 用户空间。
        rm -rf /tmp/onecloud-source
        git clone --depth=1 --branch 25.12 \
          https://github.com/garypang13/Actions-OpenWrt-Nginx.git \
          /tmp/onecloud-source

        # 先克隆到临时目录，再完整复制 target/linux/amlogic。
        rm -rf /tmp/lede-amlogic target/linux/amlogic
        git clone --depth=1 --branch master \
          https://github.com/coolsnowwolf/lede.git \
          /tmp/lede-amlogic
        test -f /tmp/lede-amlogic/image/meson8b.mk
        mkdir -p target/linux/amlogic
        cp -a /tmp/lede-amlogic/. target/linux/amlogic/
        test -f target/linux/amlogic/image/meson8b.mk

        # LEDE 当前 Amlogic target 使用 6.6 目录；本工作流的 25.12 内核为 6.12。
        if [ -d target/linux/amlogic/patches-6.6 ]; then
          mv target/linux/amlogic/patches-6.6 target/linux/amlogic/patches-6.12
        fi
        if [ -f target/linux/amlogic/config-6.6 ]; then
          mv target/linux/amlogic/config-6.6 target/linux/amlogic/config-6.12
        fi
        if [ -f target/linux/amlogic/meson8b/config-6.6 ]; then
          mv target/linux/amlogic/meson8b/config-6.6 target/linux/amlogic/meson8b/config-6.12
        fi

        sed -i -e 's/KERNEL_PATCHVER:=6.6/KERNEL_PATCHVER:=6.12/' \
               -e '/KERNEL_TESTING_PATCHVER/d' \
               -e '/autocore-arm/d' \
               -e 's/ pci pcie//' \
               target/linux/amlogic/Makefile

        rm -rf target/linux/amlogic/patches-6.12/{001-dts-s905d-fix-high-load.patch,902-use-system-LED-for-OpenWrt.patch}

        # 只复制 OneCloud 的 DTS，不应用包含外部 packit 路径的 onecloud.patch。
        ONECLOUD_DTS=/tmp/onecloud-source/devices/amlogic_meson8b/diy/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts
        test -f "$ONECLOUD_DTS"
        mkdir -p target/linux/amlogic/files/arch/arm/boot/dts/amlogic
        cp -vf "$ONECLOUD_DTS" target/linux/amlogic/files/arch/arm/boot/dts/amlogic/

        # OneCloud 无线 SDIO 支持
        patch -p1 --forward < /tmp/onecloud-source/devices/amlogic_meson8b/patches/BRCMFMAC_SDIO.patch

        echo "===== OneCloud target ====="
        test -f target/linux/amlogic/image/meson8b.mk
        grep -n "thunder-onecloud" target/linux/amlogic/image/meson8b.mk
        grep -nE 'model|compatible|phy-mode|mmc' \
          target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts | head -80

        echo "OneCloud target 已准备完成"
    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files

        cat <<EOF >>openwrt/.config
        CONFIG_TARGET_amlogic=y
        CONFIG_TARGET_amlogic_meson8b=y
        ${{ matrix.config }}
        CONFIG_TARGET_KERNEL_PARTSIZE=32
        CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.OP_rootfs }}
        CONFIG_KERNEL_EXT4_FS_SECURITY=y
        # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
        EOF

        [ -e config ] && cat config/config-common >> openwrt/.config

        if [[ "${{ github.event.inputs.ENABLE_DHCP }}" == "false" ]]; then
          rm -rf openwrt/files/etc/uci-defaults/dhcp-lan
          sed -i "s/192.168.1.1/${{ github.event.inputs.OP_IP }}/" openwrt/package/base-files/files/bin/config_generate
        fi

        # 自定义插件
        IFS=' ' read -r -a plugins <<< "${{ github.event.inputs.CUSTOM_PLUGINS }}"
        for plugin in "${plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> openwrt/.config
        done

        # PassWall
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> openwrt/.config

    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt

        # 让 OpenWrt 根据 PassWall Makefile 自动解析依赖
        make defconfig

        make download -j8

        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译源码
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"

        make -j$(nproc) || make -j1 || make -j1 V=s

        echo "status=success" >> $GITHUB_OUTPUT

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME

        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      run: |
        gunzip openwrt/bin/targets/*/*/*.gz

        for f in openwrt/bin/targets/*/*/*.img; do
          xz -9 --threads=0 --compress "$f"
        done

        rm -rf openwrt/bin/targets/*/*/*.img
        rm -rf openwrt/bin/targets/*/*/*.gz

        cd openwrt/bin/targets/*/*

        mv *.xz ${{ env.REPO_BRANCH }}-k6.12-onecloud_burn.img.xz

        rm -rf packages
        rm -rf *.buildinfo
        rm -rf profiles.json
        rm -rf *.manifest
        rm -rf *.sha
        rm -rf sha256sums

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件到Releases
      uses: softprops/action-gh-release@v2.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.release_tag }}-${{env.tag}}
        files: ${{ env.FIRMWARE }}/*
        body: |
          ====================固件信息=======================
           源码：${{ env.REPO_URL }}
           分支：${{ env.release_tag }}
           静态IP：${{ github.event.inputs.OP_IP }}
           DHCP状态：${{ github.event.inputs.ENABLE_DHCP }}
           插件：${{ github.event.inputs.CUSTOM_PLUGINS }}
           定制作者：${{ env.OP_author }}
           扩容：sh 1.sh
           默认密码：无

    - name: 清理Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 1
        delete_tags: true
