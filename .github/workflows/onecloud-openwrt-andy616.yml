name: openwrt
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ENABLE_DHCP:
        description: '是否开启DHCP'
        required: false
        default: 'false'
        type: boolean
      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.5.6'
        type: string
      OP_rootfs:
        description: '预设镜像大小'
        required: false
        default: '600'
        type: string
      OP_author:
        description: '定制作者'
        required: false
        default: 'andy616'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-app-dockerman luci-theme-m3e luci-app-ttyd luci-app-diskman luci-app-hd-idle luci-app-samba4 luci-app-passwall'
        type: string
env:
  DIY_P1_SH: sh/op.sh
jobs:
  build_firmware:
    name: 编译固件 - ${{ matrix.device }} - ${{ matrix.source }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        device: ["玩客云-ws1608"]
        source: ["openwrt"]
        include:
          - device: "玩客云-ws1608"
            config: "CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y"
    steps:
    - name: 检查分支
      uses: actions/checkout@v4
    - name: 释放磁盘空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo snap set system refresh.retain=2
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/local /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th
    - name: 编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar img2simg build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils xxd util-linux fdisk
        sudo apt-get clean
        git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th
    - name: 设置环境变量
      run: |
        TAG="$(date +'%Y%m%d')-$(openssl rand -hex 3)"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
        echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV
        echo "OP_IP=${{ github.event.inputs.OP_IP }}" >> $GITHUB_ENV
        echo "OP_author=${{ github.event.inputs.OP_author }}" >> $GITHUB_ENV
        echo "OP_rootfs=${{ github.event.inputs.OP_rootfs }}" >> $GITHUB_ENV
        echo "CUSTOM_PLUGINS=${{ github.event.inputs.CUSTOM_PLUGINS }}" >> $GITHUB_ENV
        echo "ENABLE_DHCP=${{ github.event.inputs.ENABLE_DHCP }}" >> $GITHUB_ENV
    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: 切换分支
      working-directory: ./openwrt
      id: var
      run: |
        case $REPO_BRANCH in
          openwrt-25.12)
            _release_tag=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
            git checkout $_release_tag
            _prerelease=false
            ;;
          openwrt-24.10)
            _release_tag=$(git tag --sort=taggerdate --list 'v24.*' | tail -1)
            git checkout $_release_tag
            _prerelease=false
            ;;
          *)
            echo "Can't get local/upstream's branch/tags"
            ;;
        esac
        echo "release_tag=$_release_tag" >> $GITHUB_ENV
    - name: 取回缓存 staging_dir
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir
        key: ${{ env.REPO_BRANCH }}-toolchain-cache
        restore-keys: |
          ${{ env.REPO_BRANCH }}-toolchain-cache
    - name: patch修补
      run: |
        if [ -d patch/apk-tools ]; then
          mkdir -p openwrt/package/system/apk/patches
          find patch/apk-tools -maxdepth 1 -name '*.patch' -exec cp -f {} openwrt/package/system/apk/patches/ \;
        fi
        curl -s https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/config/Config-kernel.in > openwrt/config/Config-kernel.in
        sed -i 's#https://git\.openwrt\.org/feed#https://github.com/openwrt#g; s#https://git\.openwrt\.org/project#https://github.com/openwrt#g' openwrt/feeds.conf.default
        echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> openwrt/feeds.conf.default
        echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> openwrt/feeds.conf.default
        cd openwrt
        find ./staging_dir/ -name '*' -exec touch {} \; >/dev/null 2>&1 || true
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cd ..
        [ -d patch/target ] && cp -rf patch/target openwrt/ || true
        if [ -d patch/luci ]; then
          find patch/luci -maxdepth 1 -name '*.patch' -exec cp -f {} openwrt/feeds/luci/ \;
        fi
        if [ -d patch/diy ]; then
          find patch/diy -maxdepth 1 -name '*.patch' -exec cp -f {} openwrt/ \;
        fi
    - name: 加载自定义脚本
      run: |
        if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          cd ..
        else
          echo "自定义脚本 $DIY_P1_SH 不存在，跳过"
        fi
        [ -e patch/nginx/luci.locations ] && cp -rf patch/nginx/luci.locations openwrt/feeds/packages/net/nginx/files-luci-support || true
        [ -e patch/nginx/uci.conf.template ] && cp -rf patch/nginx/uci.conf.template openwrt/feeds/packages/net/nginx-util/files || true
    - name: 添加玩客云
      run: |
        set -eux
        rm -rf /tmp/onecloud-target openwrt/target/linux/amlogic
        git clone --filter=blob:none --no-checkout https://github.com/rmoyulong/OneCloud_OpenWrt.git /tmp/onecloud-target
        cd /tmp/onecloud-target
        git checkout --detach ece61123be9f79107f5fd21448cdb8a10d8902b3
        cd $GITHUB_WORKSPACE/openwrt
        test -d /tmp/onecloud-target/lede6.12/target/linux/amlogic
        test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/Makefile
        test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/image/Makefile
        test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts
        cp -a /tmp/onecloud-target/lede6.12/target/linux/amlogic target/linux/
        chmod +x target/linux/amlogic/image/*.sh 2>/dev/null || true
        grep -q '^KERNEL_PATCHVER:=6.12$' target/linux/amlogic/Makefile
        grep -q 'Device/thunder-onecloud' target/linux/amlogic/image/Makefile
        grep -q 'meson8b-onecloud' target/linux/amlogic/image/Makefile
        echo "OneCloud target 添加成功"
    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files || true
        cat <<EOF >>openwrt/.config
        CONFIG_TARGET_amlogic=y
        CONFIG_TARGET_amlogic_meson8b=y
        ${{ matrix.config }}
        CONFIG_TARGET_KERNEL_PARTSIZE=32
        CONFIG_TARGET_ROOTFS_PARTSIZE=${{ github.event.inputs.OP_rootfs }}
        CONFIG_KERNEL_EXT4_FS_SECURITY=y
        # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
        EOF
        [ -e config ] && cat config/config-common >> openwrt/.config || true
        if [[ "${{ github.event.inputs.ENABLE_DHCP }}" == "false" ]]; then
          rm -rf openwrt/files/etc/uci-defaults/dhcp-lan || true
          sed -i "s/192.168.1.1/${{ github.event.inputs.OP_IP }}/" openwrt/package/base-files/files/bin/config_generate
        fi
        IFS=' ' read -r -a plugins <<< "${{ github.event.inputs.CUSTOM_PLUGINS }}"
        for plugin in "${plugins[@]}"; do
          echo "CONFIG_PACKAGE_${plugin}=y" >> openwrt/.config
        done
    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: 编译源码
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT
    - name: 打包标准USB线刷包
      id: organize
      run: |
        set -eux
        cd openwrt
        # 1. 找到并解压裸镜像
        IMG_GZ="$(find bin/targets -type f -name '*.img.gz' | head -1)"
        echo "裸镜像: $IMG_GZ"
        test -n "$IMG_GZ"
        gunzip -kf "$IMG_GZ"
        IMG="${IMG_GZ%.gz}"
        ls -lh "$IMG"
        # 2. 解析 MBR 分区表
        sfdisk -J "$IMG" > /tmp/parts.json
        cat /tmp/parts.json
        # 3. 分区类型：c=FAT32(boot)，83=Linux(rootfs)
        getpart() {
          python3 -c "import json;d=json.load(open('/tmp/parts.json'));ps=d['partitiontable']['partitions'];p=[x for x in ps if x['type'].upper()=='$1'][0];print(p['$2'])"
        }
        BOOT_START="$(getpart C start)"
        BOOT_SIZE="$(getpart C size)"
        ROOT_START="$(getpart 83 start)"
        ROOT_SIZE="$(getpart 83 size)"
        echo "boot:   start=$BOOT_START size=$BOOT_SIZE"
        echo "rootfs: start=$ROOT_START size=$ROOT_SIZE"
        # 4. 提取分区
        dd if="$IMG" of=/tmp/boot.PARTITION   bs=512 skip="$BOOT_START" count="$BOOT_SIZE" status=none
        dd if="$IMG" of=/tmp/rootfs.PARTITION bs=512 skip="$ROOT_START" count="$ROOT_SIZE" status=none
        ls -l /tmp/boot.PARTITION /tmp/rootfs.PARTITION
        # 5. 组装打包目录（需要仓库中有 burn-base 目录）
        PKG=/tmp/pkg
        rm -rf "$PKG"; mkdir -p "$PKG"
        cp "$GITHUB_WORKSPACE/burn-base/"* "$PKG/"
        cp /tmp/boot.PARTITION /tmp/rootfs.PARTITION "$PKG/"
        ls -l "$PKG"
        # 6. 下载 aml_image_v2_packer
        wget -q -O /tmp/aml_image_v2_packer \
          https://github.com/khadas/utils/raw/master/aml-flash-tool/tools/linux-x86/aml_image_v2_packer
        chmod +x /tmp/aml_image_v2_packer
        # 7. 打包成标准晶晨线刷包
        OUT="$GITHUB_WORKSPACE/onecloud-burn-k6.12-${tag}.img"
        ( cd "$PKG" && /tmp/aml_image_v2_packer -r image.cfg . "$OUT" )
        # 8. 校验（version 0x2 格式，可被 USB Burning Tool 正常导入）
        echo "===== 校验线刷包 ====="
        test -s "$OUT"
        ls -lh "$OUT"
        xxd -l 16 "$OUT"
        VERSION="$(xxd -p -s 4 -l 4 "$OUT")"
        echo "version=$VERSION"
        test "$VERSION" = "02000000"
        echo "===== 线刷包校验通过（version 0x2）====="
        # 9. xz 压缩
        xz -9 --threads=0 "$OUT"
        ls -lh "$GITHUB_WORKSPACE"/*.img.xz
        echo "FIRMWARE=$GITHUB_WORKSPACE" >> $GITHUB_ENV
    - name: 上传固件到Releases
      uses: softprops/action-gh-release@v2.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.release_tag }}-${{env.tag}}
        files: ${{ env.FIRMWARE }}/*.img.xz
        body: |
          ====================固件信息=======================
           源码：${{ env.REPO_URL }}
           分支：${{ env.release_tag }}
           静态IP：${{ github.event.inputs.OP_IP }}
           DHCP状态：${{ github.event.inputs.ENABLE_DHCP }}
           插件：${{ github.event.inputs.CUSTOM_PLUGINS }}
           定制作者：${{ github.event.inputs.OP_author }}
           扩容：sh 1.sh
           默认密码：无
           格式：标准晶晨线刷包（version 0x2）
    - name: 清理Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 1
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
