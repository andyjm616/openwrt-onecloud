name: OneCloud PassWall Build
on:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: 'IP地址'
        required: false
        default: '192.168.5.6'
        type: string
      OP_rootfs:
        description: 'rootfs大小MB'
        required: false
        default: '800'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件'
        required: false
        default: 'luci-theme-m3e luci-app-ttyd luci-app-diskman luci-app-hd-idle luci-app-samba4'
        type: string
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25.12
      - name: 释放磁盘
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker image prune -a -f || true
          sudo systemctl stop docker || true
          sudo apt-get clean
      - name: 编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tar img2simg build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'noreply@github.com'
      - name: 设置环境变量
        run: |
          TAG="$(date +'%Y%m%d')-$(openssl rand -hex 3)"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "OP_ROOTFS=${{ inputs.OP_rootfs }}" >> "$GITHUB_ENV"
          echo "OP_IP=${{ inputs.OP_IP }}" >> "$GITHUB_ENV"
          echo "CUSTOM_PLUGINS=${{ inputs.CUSTOM_PLUGINS }}" >> "$GITHUB_ENV"
      - name: 克隆OpenWrt
        run: |
          set -eux
          WORKDIR="$GITHUB_WORKSPACE/workdir"
          mkdir -p "$WORKDIR"
          rm -rf "$WORKDIR/openwrt" "$GITHUB_WORKSPACE/openwrt"
          for i in 1 2 3; do
            if git clone --depth 1 https://github.com/openwrt/openwrt.git "$WORKDIR/openwrt"; then break; fi
            sleep 15; rm -rf "$WORKDIR/openwrt"
          done
          cd "$WORKDIR/openwrt"
          git fetch --depth 1 origin tag v25.12.5
          git checkout v25.12.5
          ln -s "$WORKDIR/openwrt" "$GITHUB_WORKSPACE/openwrt"
      - name: 缓存工具链
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/workdir/openwrt/staging_dir
          key: openwrt-25.12-toolchain-cache
          restore-keys: openwrt-25.12-toolchain-cache
      - name: 配置feeds和PassWall
        run: |
          set -eux
          sed -i 's#https://git\.openwrt\.org/feed#https://github.com/openwrt#g; s#https://git\.openwrt\.org/project#https://github.com/openwrt#g' openwrt/feeds.conf.default
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> openwrt/feeds.conf.default
          echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 添加OneCloud target
        run: |
          set -eux
          rm -rf /tmp/oc-target openwrt/target/linux/amlogic
          git clone --filter=blob:none --no-checkout https://github.com/rmoyulong/OneCloud_OpenWrt.git /tmp/oc-target
          cd /tmp/oc-target
          git checkout --detach ece61123be9f79107f5fd21448cdb8a10d8902b3
          cd "$GITHUB_WORKSPACE/openwrt"
          cp -a /tmp/oc-target/lede6.12/target/linux/amlogic target/linux/
          chmod +x target/linux/amlogic/image/*.sh
      - name: 写入配置
        run: |
          set -eux
          cd openwrt
          cat > .config <<CFG
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson8b=y
          CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}
          CONFIG_KERNEL_EXT4_FS_SECURITY=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          CONFIG_PACKAGE_luci-app-passwall=y
          # CONFIG_PACKAGE_dockerd is not set
          # CONFIG_PACKAGE_docker is not set
CFG
          for pkg in ${CUSTOM_PLUGINS}; do echo "CONFIG_PACKAGE_${pkg}=y" >> .config; done
          sed -i -E '/^CONFIG_TARGET_/d; /^# CONFIG_TARGET_.* is not set$/d' .config
          cat >> .config <<CFG
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson8b=y
          CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}
CFG
          make defconfig
      - name: 写入静态IP
        run: |
          set -eux
          cd openwrt
          mkdir -p target/linux/amlogic/files/etc/config
          cat > target/linux/amlogic/files/etc/config/network <<NET
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'
          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '${OP_IP}'
              option netmask '255.255.255.0'
              option gateway '192.168.5.1'
              list dns '192.168.5.1'
          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth0'
NET
      - name: 下载依赖
        run: |
          set -eux
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
      - name: 编译
        run: |
          set -eux
          cd openwrt
          make -j1 V=s
      - name: 整理固件
        run: |
          set -eux
          cd openwrt
          find bin/targets -type f -print
          find bin/targets -type f -name '*.img.gz' -print
          test -n "$(find bin/targets -type f -name '*.img.gz' -print -quit)"
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-passwall-k6.12-${{ env.tag }}
          path: openwrt/bin/targets/**/*.img.gz
          if-no-files-found: error
