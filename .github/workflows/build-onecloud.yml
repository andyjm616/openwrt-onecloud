name: OneCloud Build
on:
  workflow_dispatch:
    inputs:
      ENABLE_DHCP:
        description: '是否开启DHCP'
        required: false
        default: false
        type: boolean
      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.5.6'
        type: string
      OP_rootfs:
        description: '预设镜像大小(MB)'
        required: false
        default: '800'
        type: string
      OP_author:
        description: '定制作者'
        required: false
        default: 'andyjm'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-theme-m3e luci-app-ttyd luci-app-diskman luci-app-hd-idle luci-app-samba4'
        type: string
jobs:
  build_firmware:
    name: 编译固件 - 玩客云-ws1608
    runs-on: ubuntu-22.04
    steps:
      - name: 检查分支
        uses: actions/checkout@v4
        with:
          ref: 25.12
      - name: 释放磁盘空间
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker image prune -a -f || true
          sudo systemctl stop docker || true
          sudo apt-get clean
          df -hT
      - name: 编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tar img2simg build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'noreply@github.com'
      - name: 设置环境变量
        run: |
          TAG="$(date +'%Y%m%d')-$(openssl rand -hex 3)"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "OP_ROOTFS=${{ inputs.OP_rootfs }}" >> "$GITHUB_ENV"
          echo "OP_AUTHOR=${{ inputs.OP_author }}" >> "$GITHUB_ENV"
          echo "CUSTOM_PLUGINS=${{ inputs.CUSTOM_PLUGINS }}" >> "$GITHUB_ENV"
      - name: 克隆OpenWrt
        run: |
          set -eux
          WORKDIR="$GITHUB_WORKSPACE/workdir"
          mkdir -p "$WORKDIR"
          rm -rf "$WORKDIR/openwrt" "$GITHUB_WORKSPACE/openwrt"
          for i in 1 2 3; do
            echo "=== 尝试第 $i 次克隆 ==="
            if git clone --depth 1 https://github.com/openwrt/openwrt.git "$WORKDIR/openwrt"; then
              break
            fi
            echo "克隆失败，等待后重试..."
            sleep 15
            rm -rf "$WORKDIR/openwrt"
          done
          cd "$WORKDIR/openwrt"
          git fetch --depth 1 origin tag v25.12.5
          git checkout v25.12.5
          ln -s "$WORKDIR/openwrt" "$GITHUB_WORKSPACE/openwrt"
          git log -1 --oneline
          echo "OpenWrt clone success"
      - name: 取回缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/workdir/openwrt/staging_dir
          key: openwrt-25.12-toolchain-cache
          restore-keys: |
            openwrt-25.12-toolchain-cache
      - name: 配置feeds和PassWall
        run: |
          set -eux
          sed -i 's#https://git\.openwrt\.org/feed#https://github.com/openwrt#g; s#https://git\.openwrt\.org/project#https://github.com/openwrt#g' openwrt/feeds.conf.default
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> openwrt/feeds.conf.default
          echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 添加OneCloud 6.12 target
        run: |
          set -eux
          rm -rf /tmp/onecloud-target openwrt/target/linux/amlogic
          git clone --filter=blob:none --no-checkout https://github.com/rmoyulong/OneCloud_OpenWrt.git /tmp/onecloud-target
          cd /tmp/onecloud-target
          git checkout --detach ece61123be9f79107f5fd21448cdb8a10d8902b3
          cd "$GITHUB_WORKSPACE/openwrt"
          test -d /tmp/onecloud-target/lede6.12/target/linux/amlogic
          test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/Makefile
          test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/image/Makefile
          test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts
          cp -a /tmp/onecloud-target/lede6.12/target/linux/amlogic target/linux/
          grep -q '^KERNEL_PATCHVER:=6.12$' target/linux/amlogic/Makefile
          grep -q 'Device/thunder-onecloud' target/linux/amlogic/image/Makefile
          grep -q 'meson8b-onecloud' target/linux/amlogic/image/Makefile
          echo "OneCloud target 添加成功"
      - name: 写入OneCloud配置
        run: |
          set -eux
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson8b=y
          CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}
          CONFIG_KERNEL_EXT4_FS_SECURITY=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          CONFIG_PACKAGE_luci-app-passwall=y
          # CONFIG_PACKAGE_dockerd is not set
          # CONFIG_PACKAGE_docker is not set
          EOF
          for pkg in ${CUSTOM_PLUGINS}; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          if [ -f "$GITHUB_WORKSPACE/config/config-common" ]; then
            cat "$GITHUB_WORKSPACE/config/config-common" >> .config
          fi
          sed -i -E '/^CONFIG_TARGET_/d; /^# CONFIG_TARGET_.* is not set$/d' .config
          cat >> .config <<EOF
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson8b=y
          CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}
          EOF
          make defconfig
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config
          echo "===== ARCH ====="
          grep -E '^CONFIG_TARGET_ARCH_PACKAGES=|^CONFIG_ARCH=' .config || true
          grep -qx 'CONFIG_TARGET_amlogic=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y'
          ! grep -q '^CONFIG_TARGET_mediatek' .config
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a5_neon-vfpv4"' .config
      - name: 下载依赖
        run: |
          set -eux
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
      - name: 编译源码
        run: |
          set -eux
          cd openwrt
          grep -qx 'CONFIG_TARGET_amlogic=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y' .config
          ! grep -q '^CONFIG_TARGET_mediatek' .config
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a5_neon-vfpv4"' .config
          echo '===== 开始OneCloud单线程详细编译 ====='
          make -j1 V=s
      - name: 整理固件
        run: |
          set -eux
          cd openwrt
          find bin/targets -type f -name '*.img' -print
          find bin/targets -type f -name '*.img' -exec xz -9 --threads=0 {} \;
          find bin/targets -type f -name '*.img.xz' -print
          test -n "$(find bin/targets -type f -name '*.img.xz' -print -quit)"
      - name: 上传固件到Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-openwrt-25.12.5-k6.12
          path: openwrt/bin/targets/**/*.img.xz
          if-no-files-found: error
