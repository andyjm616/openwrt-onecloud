name: apk

on:
  schedule:
    - cron: 0 20 * * 1
  repository_dispatch:
  workflow_dispatch:

env:
  DIY_P1_SH: sh/op.sh

jobs:
  build_firmware:
    name: 编译固件 - ${{ matrix.device }} - ${{ matrix.source }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        device: ["玩客云-ws1608"]
        source: ["openwrt"]
        include:
          - device: "玩客云-ws1608"
            config: "CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y"


    steps: 
    - name: 检查分支
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo snap set system refresh.retain=2
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/local /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th

    - name: 编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar img2simg build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
        sudo apt-get clean
        git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: 设置环境变量
      run: |
        TAG="$(date +'%Y%m%d')-$(openssl rand -hex 3)"
        echo "tag=$TAG" >> $GITHUB_ENV
        echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
        echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        
    - name: 切换分支
      working-directory: ./openwrt
      id: var
      run: |
        case $REPO_BRANCH in
          openwrt-25.12)
            _release_tag=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
            git checkout $_release_tag
            _prerelease=false
            ;;
          openwrt-24.10)
            _release_tag=$(git tag --sort=taggerdate --list 'v24.*' | tail -1)
            git checkout $_release_tag
            _prerelease=false
            ;;
          *)
            echo "Can't get local/upstream's branch/tags"
            ;;
        esac
        echo "release_tag=$_release_tag" >> $GITHUB_ENV
        
    - name: 取回缓存 staging_dir
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir
        key: ${{ env.REPO_BRANCH }}-toolchain-cache
        restore-keys: |
          ${{ env.REPO_BRANCH }}-toolchain-cache 
            
    - name: patch修补
      run: |
        set -x

        echo "===== 1. 检查 APK patch ====="
        if [ -d patch/apk-tools ] && compgen -G "patch/apk-tools/*.patch" > /dev/null; then
          echo "发现 APK patch:"
          ls -la patch/apk-tools/
          mkdir -p openwrt/package/system/apk/patches
          cp -vf patch/apk-tools/*.patch openwrt/package/system/apk/patches/
        else
          echo "没有 APK patch，跳过"
        fi

        echo "===== 2. 下载 Config-kernel.in ====="
        curl -fL --retry 3 --retry-delay 5 --retry-all-errors \
          https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/config/Config-kernel.in \
          -o openwrt/config/Config-kernel.in
        echo "Config-kernel.in 下载成功"

        echo "===== 3. 修改 feeds ====="
        sed -i 's#https://git\.openwrt\.org/feed#https://github.com/openwrt#g; s#https://git\.openwrt\.org/project#https://github.com/openwrt#g' \
          openwrt/feeds.conf.default

        echo "===== 4. 更新 feeds ====="
        cd openwrt
        find ./staging_dir/ -exec touch {} + >/dev/null 2>&1 || true
        ./scripts/feeds update -a
        cd ..

        echo "===== 5. target 补丁 ====="
        if [ -d patch/target ]; then
          cp -rf patch/target openwrt/
        fi

        echo "===== 6. LuCI 补丁 ====="
        if [ -d patch/luci ] && compgen -G "patch/luci/*.patch" > /dev/null; then
          cp -vf patch/luci/*.patch openwrt/feeds/luci/
        fi

        echo "===== 7. DIY 补丁 ====="
        if [ -d patch/diy ]; then
          cp -rf patch/diy openwrt/
        fi

        echo "===== patch修补完成 ====="
        
    - name: 加载自定义脚本
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        cd ..
        [ -e patch ] && cp -rf patch/nginx/luci.locations openwrt/feeds/packages/net/nginx/files-luci-support
        [ -e patch ] && cp -rf patch/nginx/uci.conf.template openwrt/feeds/packages/net/nginx-util/files

        
    - name: 添加玩客云
      run: |
        git clone https://shiyu1314:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/shiyu1314/s805 -b 6.12 openwrt/target/linux/amlogic
         
    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files
        cat <<EOF >>openwrt/.config
        CONFIG_TARGET_amlogic=y
        CONFIG_TARGET_amlogic_meson8b=y
        ${{ matrix.config }}
        CONFIG_TARGET_KERNEL_PARTSIZE=32
        CONFIG_TARGET_ROOTFS_PARTSIZE=600
        CONFIG_KERNEL_EXT4_FS_SECURITY=y
        # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
        EOF
        
        [ -e config ] && cat config/config-apk >> openwrt/.config
          
    
    - name: 加入 PassWall 源码
      run: |
        cd openwrt
        rm -rf package/passwall-packages package/passwall-luci
        git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages
        git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci
        rm -rf feeds/luci/applications/luci-app-passwall
        echo "PassWall 源码已加入"
        find package/passwall-packages package/passwall-luci -maxdepth 2 -type f -name Makefile | head -30

    - name: 下载编译依赖
      id: package
      run: |
        cd openwrt
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    
    - name: 编译源码
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      run: |
        mkdir -p openwrt/bin/packages/arm_cortex-a5_neon-vfpv4/kmod
        cp -rf openwrt/bin/targets/*/*/*/* openwrt/bin/packages/arm_cortex-a5_neon-vfpv4/kmod
        rm -rf openwrt/bin/targets/*/*/*.img
        rm -rf openwrt/bin/targets/*/*/*.gz
        rm -rf openwrt/bin/packages/*/routing
        rm -rf openwrt/bin/packages/*/telephony
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf *.buildinfo
        rm -rf profiles.json
        rm -rf *.manifest
        rm -rf *.sha
        rm -rf sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        
        
    - name: 签名
      run: |
        cd openwrt
        bash kmod-sign bin/packages/arm_cortex-a5_neon-vfpv4/base
        bash kmod-sign bin/packages/arm_cortex-a5_neon-vfpv4/kmod
        bash kmod-sign bin/packages/arm_cortex-a5_neon-vfpv4/luci
        bash kmod-sign bin/packages/arm_cortex-a5_neon-vfpv4/packages


    - name: 上传apk
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        cd openwrt/bin/packages
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "${{ env.tag }}"
        git branch -M main
        git remote add origin https://github-action:$GITHUB_TOKEN@github.com/andyjm616/openwrt-onecloud
        git fetch origin packages || true
        git checkout -B packages
        git add .
        git commit -m "${{ env.tag }}"
        git push -u origin packages --force