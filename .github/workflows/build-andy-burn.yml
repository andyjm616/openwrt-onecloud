name: andy onecloud openwrt

on:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: '静态IP地址'
        required: false
        default: '192.168.5.6'
        type: string
      OP_rootfs:
        description: '预设镜像大小(MB)'
        required: false
        default: '800'
        type: string
      CUSTOM_PLUGINS:
        description: '自定义插件名称，用空格分隔'
        required: false
        default: 'luci-theme-m3e luci-app-ttyd luci-app-diskman luci-app-hd-idle luci-app-samba4'
        type: string

jobs:
  build_firmware:
    name: 编译固件 - 玩客云-ws1608
    runs-on: ubuntu-22.04

    steps:
      - name: 检查分支
        uses: actions/checkout@v4
        with:
          ref: 25.12

      - name: 释放磁盘空间
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker image prune -a -f || true
          sudo systemctl stop docker || true
          sudo apt-get clean
          df -hT

      - name: 编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tar img2simg build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 libc6-i386 uglifyjs texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils xxd util-linux fdisk
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'noreply@github.com'

      - name: 设置环境变量
        run: |
          TAG="$(date +'%Y%m%d')-$(openssl rand -hex 3)"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "OP_ROOTFS=${{ inputs.OP_rootfs }}" >> "$GITHUB_ENV"
          echo "OP_IP=${{ inputs.OP_ip }}" >> "$GITHUB_ENV"
          echo "CUSTOM_PLUGINS=${{ inputs.CUSTOM_PLUGINS }}" >> "$GITHUB_ENV"

      - name: 克隆OpenWrt
        run: |
          set -eux
          WORKDIR="$GITHUB_WORKSPACE/workdir"
          mkdir -p "$WORKDIR"
          rm -rf "$WORKDIR/openwrt" "$GITHUB_WORKSPACE/openwrt"
          for i in 1 2 3; do
            echo "=== 尝试第 $i 次克隆 ==="
            if git clone --depth 1 https://github.com/openwrt/openwrt.git "$WORKDIR/openwrt"; then
              break
            fi
            echo "克隆失败，等待后重试..."
            sleep 15
            rm -rf "$WORKDIR/openwrt"
          done
          cd "$WORKDIR/openwrt"
          git fetch --depth 1 origin tag v25.12.5
          git checkout v25.12.5
          ln -s "$WORKDIR/openwrt" "$GITHUB_WORKSPACE/openwrt"
          git log -1 --oneline
          echo "OpenWrt clone success"

      - name: 取回缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/workdir/openwrt/staging_dir
          key: openwrt-25.12-toolchain-cache
          restore-keys: |
            openwrt-25.12-toolchain-cache

      - name: 配置feeds和PassWall
        run: |
          set -eux
          sed -i 's#https://git\.openwrt\.org/feed#https://github.com/openwrt#g; s#https://git\.openwrt\.org/project#https://github.com/openwrt#g' openwrt/feeds.conf.default
          echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> openwrt/feeds.conf.default
          echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 添加OneCloud 6.12 target
        run: |
          set -eux
          rm -rf /tmp/onecloud-target openwrt/target/linux/amlogic
          git clone --filter=blob:none --no-checkout https://github.com/rmoyulong/OneCloud_OpenWrt.git /tmp/onecloud-target
          cd /tmp/onecloud-target
          git checkout --detach ece61123be9f79107f5fd21448cdb8a10d8902b3
          cd "$GITHUB_WORKSPACE/openwrt"
          test -d /tmp/onecloud-target/lede6.12/target/linux/amlogic
          test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/Makefile
          test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/image/Makefile
          test -f /tmp/onecloud-target/lede6.12/target/linux/amlogic/files/arch/arm/boot/dts/amlogic/meson8b-onecloud.dts
          cp -a /tmp/onecloud-target/lede6.12/target/linux/amlogic target/linux/
          chmod +x target/linux/amlogic/image/*.sh 2>/dev/null || true
          grep -q '^KERNEL_PATCHVER:=6.12$' target/linux/amlogic/Makefile
          grep -q 'Device/thunder-onecloud' target/linux/amlogic/image/Makefile
          grep -q 'meson8b-onecloud' target/linux/amlogic/image/Makefile
          echo "OneCloud target 添加成功"

      - name: 写入OneCloud配置
        run: |
          set -ux
          cd openwrt
          cat > .config <<CONFIGEOF
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson8b=y
          CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}
          CONFIG_KERNEL_EXT4_FS_SECURITY=y
          CONFIG_PACKAGE_luci-app-passwall=y
          # CONFIG_PACKAGE_dockerd is not set
          # CONFIG_PACKAGE_docker is not set
          CONFIGEOF
          for pkg in ${CUSTOM_PLUGINS}; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          if [ -f "$GITHUB_WORKSPACE/config/config-common" ]; then
            cat "$GITHUB_WORKSPACE/config/config-common" >> .config
          fi
          sed -i -E '/^CONFIG_TARGET_/d; /^# CONFIG_TARGET_.* is not set$/d' .config
          cat >> .config <<CONFIGEOF
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson8b=y
          CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}
          CONFIGEOF
          make defconfig
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config
          echo "===== ARCH ====="
          grep -E '^CONFIG_TARGET_ARCH_PACKAGES=|^CONFIG_ARCH=' .config || true
          grep -qx 'CONFIG_TARGET_amlogic=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y' .config
          ! grep -q '^CONFIG_TARGET_mediatek' .config
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a5_neon-vfpv4"' .config
          grep -qx 'CONFIG_TARGET_KERNEL_PARTSIZE=32' .config
          grep -qx "CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}" .config
          echo "rootfs 分区大小校验通过: ${OP_ROOTFS}MB"

      - name: 写入静态IP网络配置
        run: |
          set -eux
          cd openwrt
          mkdir -p files/etc/config
          cat > files/etc/config/network <<NETWORKEOF

          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'

          config device
                  option name 'br-lan'
                  option type 'bridge'
                  list ports 'eth0'

          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '${OP_IP}'
                  option netmask '255.255.255.0'
                  option gateway '192.168.5.1'
                  option dns '192.168.5.1'
          NETWORKEOF
          echo "网络配置写入完成，IP=${OP_IP}"
          cat files/etc/config/network

      - name: 下载依赖
        run: |
          set -eux
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译源码
        run: |
          set -eux
          cd openwrt
          grep -qx 'CONFIG_TARGET_amlogic=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b=y' .config
          grep -qx 'CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y' .config
          ! grep -q '^CONFIG_TARGET_mediatek' .config
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="arm_cortex-a5_neon-vfpv4"' .config
          grep -qx 'CONFIG_TARGET_KERNEL_PARTSIZE=32' .config
          grep -qx "CONFIG_TARGET_ROOTFS_PARTSIZE=${OP_ROOTFS}" .config
          echo '===== 开始OneCloud单线程详细编译 ====='
          make -j1 V=s

      - name: 打包USB线刷包
        run: |
          set -eux
          cd openwrt

          # 1. 找到并解压裸镜像（.img.gz）
          IMG_GZ="$(find bin/targets -type f -name '*.img.gz' | head -1)"
          echo "裸镜像: $IMG_GZ"
          test -n "$IMG_GZ"
          gunzip -kf "$IMG_GZ"
          IMG="${IMG_GZ%.gz}"
          ls -lh "$IMG"

          # 2. 解析 MBR 分区表（JSON）
          sfdisk -J "$IMG" > /tmp/parts.json
          cat /tmp/parts.json

          # 3. 分区类型：0x0C=FAT32(boot)，0x83=Linux(rootfs)
          getpart() {
            python3 -c "import json;d=json.load(open('/tmp/parts.json'));ps=d['partitiontable']['partitions'];p=[x for x in ps if x['type'].upper()=='$1'][0];print(p['$2'])"
          }
          BOOT_START="$(getpart 0C start)"
          BOOT_SIZE="$(getpart 0C size)"
          ROOT_START="$(getpart 83 start)"
          ROOT_SIZE="$(getpart 83 size)"
          echo "boot:   start=$BOOT_START size=$BOOT_SIZE"
          echo "rootfs: start=$ROOT_START size=$ROOT_SIZE"

          # 4. 提取两个分区内容
          dd if="$IMG" of=/tmp/boot.PARTITION   bs=512 skip="$BOOT_START" count="$BOOT_SIZE" status=none
          dd if="$IMG" of=/tmp/rootfs.PARTITION bs=512 skip="$ROOT_START" count="$ROOT_SIZE" status=none
          ls -l /tmp/boot.PARTITION /tmp/rootfs.PARTITION

          # 5. 组装打包目录（固定文件来自 burn-base）
          PKG=/tmp/pkg
          rm -rf "$PKG"; mkdir -p "$PKG"
          cp "$GITHUB_WORKSPACE/burn-base/"* "$PKG/"
          cp /tmp/boot.PARTITION /tmp/rootfs.PARTITION "$PKG/"
          ls -l "$PKG"

          # 6. 下载 Linux 版 aml_image_v2_packer
          wget -q -O /tmp/aml_image_v2_packer \
            https://github.com/khadas/utils/raw/master/aml-flash-tool/tools/linux-x86/aml_image_v2_packer
          chmod +x /tmp/aml_image_v2_packer

          # 7. 打包成晶晨线刷包
          OUT="$GITHUB_WORKSPACE/onecloud-burn-k6.12-${tag}.img"
          ( cd "$PKG" && /tmp/aml_image_v2_packer -r image.cfg . "$OUT" )

          # 8. 校验魔数 CA 6E DE 1B
          echo "===== 校验线刷包头 ====="
          xxd -l 16 "$OUT"
          MAGIC="$(xxd -p -l 4 "$OUT")"
          echo "magic=$MAGIC"
          test "$MAGIC" = "ca6ede1b"

          # 9. xz 压缩
          xz -9 --threads=0 "$OUT"
          ls -lh "$GITHUB_WORKSPACE"/*.img.xz

      - name: 上传线刷包到Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-burn-k6.12-${{ env.tag }}
          path: ./*.img.xz
          if-no-files-found: error
